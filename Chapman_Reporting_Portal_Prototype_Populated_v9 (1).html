<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chapman Reporting Portal Prototype</title>
  <style>
    :root {
      --bg: #f7f3ea; --panel: #ffffff; --ink: #1c1c1c; --muted: #6b6b6b; --gold: #b9972f;
      --gold-soft: #f4ebc9; --line: #dfdfdf; --green: #2f855a; --green-soft: #d9f2e3;
      --red: #c53030; --red-soft: #fde1e1; --amber: #d69e2e; --amber-soft: #fff1cc;
      --blue: #2b6cb0; --blue-soft: #d9e8f9;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Inter, Arial, sans-serif; background: var(--bg); color: var(--ink); }
    .shell { display: grid; grid-template-columns: 280px 1fr; min-height: 100vh; }
    .sidebar { background: #111; color: #fff; padding: 24px; }
    .brand { font-size: 1.15rem; font-weight: 800; line-height: 1.4; margin-bottom: 20px; text-align:center; }
    .brand img { width: 132px; max-width: 100%; height: auto; display:block; margin: 0 auto 14px; }
    .brand small { display:block; color:#d6c275; font-weight:600; margin-top:6px; }
    .nav button { width: 100%; text-align: left; margin: 0 0 10px; padding: 12px 14px; background: #222; color: #fff; border: 1px solid #333; border-radius: 10px; cursor: pointer; }
    .nav button.active { background: var(--gold); color: #111; border-color: var(--gold); font-weight: 700; }
    .content { padding: 26px; }
    .hero { display:flex; justify-content:space-between; align-items:flex-start; gap:20px; margin-bottom:20px; }
    .hero h1 { margin:0; font-size: 1.9rem; }
    .hero p { color: var(--muted); max-width: 760px; }
    .top-cards, .grid-3, .grid-2 { display:grid; gap:16px; }
    .top-cards { grid-template-columns: repeat(4, 1fr); margin-bottom: 20px; }
    .grid-3 { grid-template-columns: repeat(3, 1fr); }
    .grid-2 { grid-template-columns: repeat(2, 1fr); }
    .card { background: var(--panel); border:1px solid var(--line); border-radius:16px; padding:18px; box-shadow: 0 6px 18px rgba(0,0,0,.04); }
    .card h3, .card h4 { margin-top:0; }
    .metric { font-size: 1.9rem; font-weight: 800; }
    .muted { color: var(--muted); }
    .badge { display:inline-block; padding: 5px 10px; border-radius:999px; font-size:.82rem; font-weight:700; }
    .approved { background: var(--green-soft); color: var(--green); }
    .pending { background: var(--amber-soft); color: #8a6400; }
    .blocked { background: var(--red-soft); color: var(--red); }
    .draft { background: var(--blue-soft); color: var(--blue); }
    select, input, button, textarea { font: inherit; }
    .filters { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:16px; }
    .filters select, .filters input { padding: 10px 12px; border-radius: 10px; border:1px solid var(--line); background:#fff; }
    .btn { padding: 10px 14px; border-radius: 10px; border: 1px solid #111; background:#111; color:#fff; cursor:pointer; }
    .btn.secondary { background:#fff; color:#111; }
    .btn.gold { background: var(--gold); border-color: var(--gold); color:#111; font-weight:700; }
    .table { width:100%; border-collapse: collapse; }
    .table th, .table td { text-align:left; padding: 10px 12px; border-bottom:1px solid var(--line); vertical-align: top; }
    .table th { background:#faf7ee; position: sticky; top: 0; z-index: 1; }
    .table-wrap { max-height: 62vh; overflow: auto; border:1px solid var(--line); border-radius: 12px; background:#fff; }
    .criterion-row { display:grid; grid-template-columns: 220px 1fr 110px 110px; gap:12px; padding:12px; border-bottom:1px solid var(--line); }
    .criterion-row:nth-child(odd) { background: #fcfcfc; }
    .section { background: var(--gold-soft); border:1px solid #eadfb6; padding: 10px 12px; border-radius: 12px; margin: 18px 0 10px; font-weight: 800; }
    .subsection { color:#333; font-weight:700; padding: 10px 0 6px; }
    .accordion { border:1px solid var(--line); border-radius: 14px; background:#fff; margin: 14px 0; overflow:hidden; }
    .accordion summary { list-style:none; cursor:pointer; padding: 14px 16px; background: #faf7ee; display:flex; justify-content:space-between; align-items:center; font-weight:800; }
    .accordion summary::-webkit-details-marker { display:none; }
    .accordion summary span { color: var(--muted); font-weight:600; font-size:.9rem; }
    .accordion-content { padding: 0 14px 14px; }
    .progress { width:100%; height:12px; background:#eee; border-radius:999px; overflow:hidden; }
    .progress > span { display:block; height:100%; background: linear-gradient(90deg, var(--gold), #e3c45b); }
    .mini-bar { height: 14px; background:#eee; border-radius:999px; overflow:hidden; }
    .mini-bar span { display:block; height:100%; background: var(--blue); }
    .view { display:none; }
    .view.active { display:block; }
    .kpi-note { font-size:.88rem; color:var(--muted); margin-top:8px; }
    .queue-item { display:flex; justify-content:space-between; gap:14px; padding:14px 0; border-bottom:1px solid var(--line); }
    .queue-item:last-child { border-bottom:none; }
    .signoff-rail { display:flex; gap:10px; flex-wrap:wrap; margin-top:8px; }
    .pill { padding:6px 10px; border-radius:999px; border:1px solid var(--line); background:#fff; font-size:.84rem; }
    .login-box { max-width: 740px; }
    .workflow { display:grid; grid-template-columns: repeat(4, 1fr); gap:14px; }
    .step { background:#fff; border:1px solid var(--line); border-radius:14px; padding:16px; position:relative; }
    .step:after { content:'→'; position:absolute; right:-11px; top:40%; font-size:24px; color:#adadad; }
    .step:last-child:after { display:none; }
    .callout { border-left: 4px solid var(--gold); padding: 12px 14px; background: #fffaf0; border-radius: 10px; }
    @media (max-width: 1100px) {
      .shell { grid-template-columns: 1fr; }
      .sidebar { position: sticky; top: 0; z-index: 10; }
      .top-cards, .grid-3, .grid-2, .workflow { grid-template-columns: 1fr; }
      .criterion-row { grid-template-columns: 1fr; }
    }
  </style>
</head>

      <div class="table-wrap" style="margin-top:16px; max-height:70vh;">${rows}</div>
    </div>`;
}
function queueHtml(role){
  const isDistrict = role === 'district';
  const items = DATA.submissions.filter(s => isDistrict ? ['Pending','Approved'].includes(s.district_review) : ['Pending','Approved'].includes(s.regional_review));
  return items.map(s => {
    const ch = chapterById(s.chapter_id); const score = DATA.scores[s.chapter_id]?.Fall;
    return `<div class="queue-item"><div><strong>${ch.name}</strong> <span class="muted">${ch.id}</span><br/><span class="muted">${ch.district} • ${ch.region} • ${ch.type}</span><div class="signoff-rail"><span class="pill">District: ${s.district_review}</span><span class="pill">Regional: ${s.regional_review}</span><span class="pill">Executive: ${s.executive_review}</span></div></div><div><div><strong>${score?.earned || 0} / ${score?.possible || (ch.type==='College'?DATA.meta.collegeCriteriaCount:DATA.meta.alumniCriteriaCount)}</strong></div><div class="muted">Fall score</div><div style="margin-top:8px; display:flex; gap:8px; justify-content:flex-end;"><button class="btn secondary" onclick="alert('Revision request sent in prototype.')">Request Revision</button><button class="btn gold" onclick="alert('Approval captured in prototype.')">Approve</button></div></div></div>`;
  }).join('');
}
function renderDistrictRows(){
  const groups = {};
  DATA.chapters.forEach(ch => { if (!groups[ch.district]) groups[ch.district] = {total:0, started:0, approved:0}; groups[ch.district].total++; const sub = DATA.submissions.find(s => s.chapter_id === ch.id); if (sub && sub.status !== 'Draft') groups[ch.district].started++; if (sub && sub.district_review === 'Approved') groups[ch.district].approved++; });
  return Object.entries(groups).map(([k,v]) => `<tr><td>${k}</td><td>${v.started} / ${v.total}</td><td>${v.approved}</td><td><div class="mini-bar"><span style="width:${pct(v.started,v.total)}%"></span></div></td></tr>`).join('');
}
function renderRegionalRows(){
  const groups = {};
  DATA.chapters.forEach(ch => { if (!groups[ch.region]) groups[ch.region] = {total:0, started:0, approved:0}; groups[ch.region].total++; const sub = DATA.submissions.find(s => s.chapter_id === ch.id); if (sub && sub.status !== 'Draft') groups[ch.region].started++; if (sub && sub.regional_review === 'Approved') groups[ch.region].approved++; });
  return Object.entries(groups).map(([k,v]) => `<tr><td>${k}</td><td>${v.started} / ${v.total}</td><td>${v.approved}</td><td><div class="mini-bar"><span style="width:${pct(v.started,v.total)}%"></span></div></td></tr>`).join('');
}

function renderRegional(){

function renderExecutive(){
  const eligible = DATA.submissions.filter(s => s.district_review === 'Approved' && s.regional_review === 'Approved');

}
function renderAnalytics(){
  const districts = {}, regions = {}; let nationalEarned = 0, nationalPossible = 0;
  DATA.chapters.forEach(ch => { const score = DATA.scores[ch.id]?.Fall; if (!score) return; if (!districts[ch.district]) districts[ch.district] = {earned:0, possible:0}; if (!regions[ch.region]) regions[ch.region] = {earned:0, possible:0}; districts[ch.district].earned += score.earned; districts[ch.district].possible += score.possible; regions[ch.region].earned += score.earned; regions[ch.region].possible += score.possible; nationalEarned += score.earned; nationalPossible += score.possible; });
  const districtCards = Object.entries(districts).map(([name,v]) => `<div class="card"><h4>${name}</h4><div class="metric">${pct(v.earned,v.possible)}%</div><div class="progress"><span style="width:${pct(v.earned,v.possible)}%"></span></div><div class="kpi-note">${v.earned} / ${v.possible} points</div></div>`).join('');
  const regionCards = Object.entries(regions).map(([name,v]) => `<div class="card"><h4>${name}</h4><div class="metric">${pct(v.earned,v.possible)}%</div><div class="progress"><span style="width:${pct(v.earned,v.possible)}%"></span></div><div class="kpi-note">${v.earned} / ${v.possible} points</div></div>`).join('');
  el('analytics').innerHTML = `<div class="hero"><div><h1>District, regional, and national rollups</h1><p>Aggregation view for compliance and standing decisions across every reporting level.</p></div><div class="card"><div class="muted">National fall completion</div><div class="metric">${pct(nationalEarned,nationalPossible)}%</div><div class="kpi-note">${nationalEarned} / ${nationalPossible} scored points</div></div></div><h3>District rollups</h3><div class="grid-3">${districtCards}</div><h3 style="margin-top:22px;">Regional rollups</h3><div class="grid-3">${regionCards}</div><h3 style="margin-top:22px;">National operations panel</h3><div class="card"><table class="table"><tr><th>Chapter</th><th>Type</th><th>District</th><th>Region</th><th>Fall score</th><th>Status</th></tr>${DATA.chapters.map(ch => { const s = DATA.submissions.find(x=>x.chapter_id===ch.id); const sc=DATA.scores[ch.id]?.Fall; return `<tr><td>${ch.name}</td><td>${ch.type}</td><td>${ch.district}</td><td>${ch.region}</td><td>${sc?.earned || 0} / ${sc?.possible || 0}</td><td>${statusBadge(s?.status || 'Draft')}</td></tr>`; }).join('')}</table></div>`;
}

tton class="btn secondary" onclick="alert('Prototype CSV import modal.')">Import CSV</button><button class="btn gold" onclick="alert('Prototype sync with source system.')">Sync Source System</button></div></div><div class="card"><h3>Governance controls</h3><div class="queue-item"><div><strong>Submission windows</strong><div class="muted">Enable Fall and Spring cycles separately</div></div><div><button class="btn secondary">Configure</button></div></div><div class="queue-item"><div><strong>Reviewer assignment</strong><div class="muted">Assign district and regional approvers to chapter groups</div></div><div><button class="btn secondary">Manage</button></div></div><div class="queue-item"><div><strong>Rubric versioning</strong><div class="muted">Freeze criteria by fraternal year and term</div></div><div><button class="btn secondary">Version Rules</button></div></div><div class="queue-item"><div><strong>Required-item penalties</strong><div class="muted">Future rule engine for -1 compliance deductions</div></div><div><button class="btn gold">Coming Next</button></div></div><div class="queue-item"><div><strong>Bulk reviewer assignment template</strong><div class="muted">Populate District Director and Regional Vice President mappings by chapter key, district, and region. Executive Director is fixed globally.</div></div><div><button class="btn secondary">Upload Template</button></div></div></div></div>`;

function renderArchitecture(){

rds with timestamps and comments.</td></tr><tr><td>Rollup</td><td>Precomputed district/regional/national totals for fast dashboards.</td></tr></table></div>`;
